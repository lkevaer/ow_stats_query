name: Check application
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements_for_api.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check api_server/static/batch_rating.js
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ow-stats:test .
      - name: Verify container readiness and Chinese OCR
        run: |
          docker run -d --name ow-stats-test -p 127.0.0.1:41888:8080 ow-stats:test
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:41888/ready; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:41888/ready
          curl -fsS http://127.0.0.1:41888/batch-rating
          docker exec ow-stats-test tesseract --list-langs | grep -F chi_sim
          docker exec ow-stats-test tesseract --list-langs | grep -F eng
